
name: Compilar Maite Lab Android

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maite-lab-android
  cancel-in-progress: false

jobs:
  reparar:
    name: Reparar dependencias
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MaiteLabApp_IA_web_v1

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerar archivo de bloqueo
        run: |
          npm install --package-lock-only --legacy-peer-deps
          npm ci --include=dev --legacy-peer-deps

      - name: Guardar archivos corregidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Reparar bloqueo de dependencias"
            git push origin HEAD:main
          fi

  compilar:
    name: Generar APK
    needs: reparar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MaiteLabApp_IA_web_v1

    steps:
      - name: Descargar proyecto corregido
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar dependencias
        run: npm ci --include=dev --legacy-peer-deps

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Compilar Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          eas build --platform android --profile preview --non-interactive
