
name: Compilar Maite Lab Android

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maite-lab-android
  cancel-in-progress: false

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MaiteLabApp_IA_web_v1

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      
      - name: Sincronizar dependencias
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix --npm
          npm install --legacy-peer-deps
          npm ci --include=dev --legacy-peer-deps


      - name: Verificar archivo de bloqueo
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          npm ci --include=dev --legacy-peer-deps

      - name: Guardar dependencias actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar dependencias Expo"
            git push origin HEAD:main
          fi

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Validar proyecto Expo
        run: |
          npx expo config --type public
          npx expo-doctor

      - name: Compilar Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive
